name: Build HEOS Custom 1.2.8

on:
  workflow_dispatch:

env:
  INTG_NAME: heos-custom
  PYTHON_VER: 3.11.12-0.3.0

jobs:
  build:
    name: Build ARM64 Custom HEOS 1.2.8
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Download exact HEOS 2.1.2 source
        run: |
          git clone --depth 1 --branch v2.1.2             https://github.com/mase1981/uc-intg-heos.git upstream

      - name: Copy original HEOS source
        run: |
          cp -r upstream/uc_intg_heos .
          cp upstream/driver.json .
          cp upstream/requirements.txt .

      - name: Apply Media Player patch only
        run: |
          python3 patch_media_player_1.2.8.py
          python3 -m py_compile uc_intg_heos/media_player.py

      - name: Create valid custom driver metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("driver.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["driver_id"] = "heos-custom"
          data["version"] = "1.2.8"
          data["name"] = {"en": "HEOS Custom"}
          data["description"] = {
              "en": "HEOS Media Player with native Remote 3 UI, live favorites and Denon AVR controls.",
              "de": "HEOS Media Player mit nativer Remote-3-Oberfläche, Live-Favoriten und Denon-AVR-Steuerung."
          }
          data["developer"] = {
              "name": "celle150190-prog",
              "url": "https://github.com/celle150190-prog"
          }
          data["home_page"] = "https://github.com/celle150190-prog/uc-intg-heos-custom"

          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          json.loads(path.read_text(encoding="utf-8"))
          print("driver.json valid")
          print("driver_id:", data["driver_id"])
          print("version:", data["version"])
          PY

      - name: Enable ARM64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged             multiarch/qemu-user-static --reset -p yes

      - name: Build ARM64 driver
        run: |
          docker run --rm             --name heos-custom-builder             --platform=aarch64             --user=$(id -u):$(id -g)             -v "${GITHUB_WORKSPACE}:/workspace"             docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER}             bash -c             "cd /workspace &&              python -m pip install -r requirements.txt &&              pyinstaller --clean --onedir              --name intg-heos-custom              --collect-all zeroconf              --add-data driver.json:.              uc_intg_heos/__init__.py"

      - name: Create Remote 3 package
        run: |
          mkdir -p artifacts/bin
          cp -r dist/intg-heos-custom/* artifacts/bin/
          mv artifacts/bin/intg-heos-custom artifacts/bin/driver
          cp driver.json artifacts/
          tar czvf uc-intg-heos-1.2.8-custom-aarch64.tar.gz -C artifacts .

      - name: Upload finished integration
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-heos-1.2.8-custom-aarch64
          path: uc-intg-heos-1.2.8-custom-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 7
