name: Build HEOS Custom

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build standalone HEOS Remote UI aarch64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout custom project
        uses: actions/checkout@v4

      - name: Checkout exact HEOS 2.1.2
        run: git clone --depth 1 --branch v2.1.2 https://github.com/mase1981/uc-intg-heos.git upstream

      - name: Apply Remote UI patch
        run: python patches/apply_remote_ui.py

      - name: Apply device helper patch
        run: python patches/apply_device.py

      - name: Verify Media Player is untouched
        run: git -C upstream diff --exit-code -- uc_intg_heos/media_player.py

      - name: Prepare metadata
        run: cp driver.json upstream/driver.json

      - name: Build ARM64
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker run --rm --platform=aarch64 --user=$(id -u):$(id -g) -v ${GITHUB_WORKSPACE}:/workspace docker.io/unfoldedcircle/r2-pyinstaller:3.11.12-0.3.0 bash -c "cd /workspace/upstream && python -m pip install -r requirements.txt && pyinstaller --clean --onedir --name intg-heos --collect-all zeroconf --add-data driver.json:. uc_intg_heos/__init__.py"
          mkdir -p upstream/artifacts/bin
          cp -a upstream/dist/intg-heos/. upstream/artifacts/bin/
          mv upstream/artifacts/bin/intg-heos upstream/artifacts/bin/driver
          cp upstream/driver.json upstream/artifacts/driver.json
          tar -C upstream/artifacts -czf uc-intg-heos-2.1.2-remoteui.1-aarch64.tar.gz .

      - name: Upload installable driver
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-heos-2.1.2-remoteui.1-aarch64
          path: uc-intg-heos-2.1.2-remoteui.1-aarch64.tar.gz
