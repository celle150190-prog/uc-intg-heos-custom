name: Build HEOS Custom 1.2.8

on:
  workflow_dispatch:

env:
  INTG_NAME: heos-custom
  PYTHON_VER: 3.11.12-0.3.0

jobs:
  build:
    name: Build ARM64 Custom HEOS 1.2.8
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Download exact HEOS 2.1.2 source
        run: |
          git clone --depth 1 --branch v2.1.2 \
            https://github.com/mase1981/uc-intg-heos.git upstream

      - name: Copy original HEOS source
        run: |
          cp -r upstream/uc_intg_heos .
          cp upstream/driver.json .
          cp upstream/requirements.txt .

      - name: Apply Media Player patch
        run: |
          python3 patch_media_player_1.2.8.py
          python3 -m py_compile uc_intg_heos/media_player.py

      - name: Create valid custom driver metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("driver.json")
          raw = path.read_text(encoding="utf-8").strip()

          if raw.endswith("\\n"):
              raw = raw[:-2].rstrip()

          data = json.loads(raw)
          data["driver_id"] = "heos-custom"
          data["version"] = "1.2.8"

          data["name"] = {"en": "HEOS Custom"}
          data["description"] = {
              "en": "Custom HEOS Media Player with favorites, Denon AVR controls and native Remote 3 media UI.",
              "de": "Benutzerdefinierter HEOS Media Player mit Favoriten, Denon-AVR-Steuerung und nativer Media-UI der Remote 3."
          }
          data["developer"] = {
              "name": "celle150190-prog",
              "url": "https://github.com/celle150190-prog"
          }
          data["home_page"] = "https://github.com/celle150190-prog/uc-intg-heos-custom"

          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          json.loads(path.read_text(encoding="utf-8"))
          print("driver.json valid")
          print("driver_id:", data["driver_id"])
          print("version:", data["version"])
          PY

      - name: Enable ARM64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged \
            multiarch/qemu-user-static --reset -p yes

      - name: Build ARM64 driver
        run: |
          docker run --rm \
            --name heos-custom-builder \
            --platform=aarch64 \
            --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
             python -m pip install -r requirements.txt && \
             pyinstaller --clean --onedir \
             --name intg-heos-custom \
             --collect-all zeroconf \
             --add-data driver.json:. \
             uc_intg_heos/__init__.py"

      - name: Create Remote 3 installation archive
        run: |
          rm -rf artifacts
          mkdir -p artifacts/bin
          cp -r dist/intg-heos-custom/* artifacts/bin/
          mv artifacts/bin/intg-heos-custom artifacts/bin/driver
          cp driver.json artifacts/driver.json

          test -f artifacts/driver.json
          test -x artifacts/bin/driver || chmod +x artifacts/bin/driver

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("artifacts/driver.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["driver_id"] == "heos-custom"
          assert data["version"] == "1.2.8"
          print("Archive metadata OK")
          PY

          tar czvf uc-intg-heos-custom-1.2.8-aarch64.tar.gz \
            -C artifacts .

      - name: Verify final archive
        run: |
          python3 - <<'PY'
          import json
          import tarfile

          archive = "uc-intg-heos-custom-1.2.8-aarch64.tar.gz"

          with tarfile.open(archive, "r:gz") as tar:
              names = {n.lstrip("./") for n in tar.getnames()}
              assert "driver.json" in names
              assert "bin/driver" in names

              member = next(
                  m for m in tar.getmembers()
                  if m.name.lstrip("./") == "driver.json"
              )
              data = json.loads(tar.extractfile(member).read().decode("utf-8"))
              assert data["driver_id"] == "heos-custom"
              assert data["version"] == "1.2.8"

          print("Final archive validation OK")
          PY

      - name: Upload finished integration
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-heos-custom-1.2.8-aarch64
          path: uc-intg-heos-custom-1.2.8-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14
