name: Build HEOS Remote 3 custom integration

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'HEOS upstream tag (leave empty to use latest)'
        required: false
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/mase1981/uc-intg-heos.git
  PYINSTALLER_IMAGE: docker.io/unfoldedcircle/r2-pyinstaller:3.11.12-0.3.0
  PYINSTALLER_NAME: intg-heos-denon-ui
  CUSTOM_REPO: https://github.com/celle150190-prog/uc-intg-heos-custom

jobs:
  build:
    name: Build ARM64 Remote 3 archive
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom project
        uses: actions/checkout@v6

      - name: Determine HEOS upstream version and custom release number
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested='${{ inputs.upstream_tag }}'
          if [ -n "$requested" ]; then
            upstream_tag="$requested"
          else
            upstream_tag="$(git ls-remote --tags --refs "$UPSTREAM_REPO" 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -n1)"
          fi
          test -n "$upstream_tag"
          upstream_version="${upstream_tag#v}"

          current_version="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('driver.json').read_text())['version'])
          PY
          )"
          current_base="$(printf '%s' "$current_version" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ ! "$current_base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Unable to determine upstream version from driver.json version '$current_version'"
            exit 1
          fi

          echo "Upstream: $upstream_tag"
          echo "Current custom version: $current_version"

          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$upstream_version" = "$current_base" ] && [ -z "$requested" ]; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "No new HEOS release found. Nothing to build."
            exit 0
          fi

          max_suffix=0
          while IFS= read -r tag; do
            suffix="${tag#v${upstream_version}.}"
            if [[ "$tag" =~ ^v${upstream_version}\.[0-9]+$ ]] && [[ "$suffix" =~ ^[0-9]+$ ]]; then
              if (( suffix > max_suffix )); then
                max_suffix=$suffix
              fi
            fi
          done < <(gh release list --limit 1000 --json tagName --jq '.[].tagName' || true)

          custom_suffix=$((max_suffix + 1))
          custom_version="${upstream_version}.${custom_suffix}"
          release_tag="v${custom_version}"

          echo "custom_suffix=$custom_suffix" >> "$GITHUB_OUTPUT"
          echo "custom_version=$custom_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_needed=true" >> "$GITHUB_OUTPUT"
          echo "Publishing custom version: $custom_version"

      - name: Setup QEMU for ARM64
        if: steps.version.outputs.build_needed == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Clone exact HEOS source
        if: steps.version.outputs.build_needed == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          rm -rf /tmp/heos-source
          git clone --depth 1 --branch "$UPSTREAM_TAG" "$UPSTREAM_REPO" /tmp/heos-source
          test "$(git -C /tmp/heos-source describe --tags --exact-match)" = "$UPSTREAM_TAG"

      - name: Verify upstream source layout
        if: steps.version.outputs.build_needed == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
        run: |
          set -euo pipefail
          test -f /tmp/heos-source/uc_intg_heos/__init__.py
          test -f /tmp/heos-source/uc_intg_heos/driver.py
          test -f /tmp/heos-source/driver.json
          test -f /tmp/heos-source/requirements.txt
          test -f /tmp/heos-source/uc_intg_heos/remote.py
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('/tmp/heos-source/driver.json').read_text())
          assert data['version'] == os.environ['UPSTREAM_VERSION']
          PY

      - name: Install custom remote
        if: steps.version.outputs.build_needed == 'true'
        run: |
          cp uc_intg_heos/remote.py /tmp/heos-source/uc_intg_heos/remote.py
          python3 scripts/apply_favorite_navigation_fix.py /tmp/heos-source/uc_intg_heos/remote.py

      - name: Generate custom metadata
        if: steps.version.outputs.build_needed == 'true'
        env:
          CUSTOM_VERSION: ${{ steps.version.outputs.custom_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('driver.json').read_text())
          data['driver_id'] = 'heos-denon-ui'
          data['version'] = os.environ['CUSTOM_VERSION']
          data.setdefault('name', {})['en'] = 'HEOS Remote 3 Custom'
          data['home_page'] = os.environ['CUSTOM_REPO']
          data['custom'] = True
          developer = data.get('developer')
          if not isinstance(developer, dict):
              developer = {}
          developer['name'] = developer.get('name') or 'Marci / Custom Project'
          developer['url'] = os.environ['CUSTOM_REPO']
          data['developer'] = developer
          data.setdefault('description', {})['en'] = 'HEOS integration with a custom Remote 3 remote UI for Denon AVR control.'
          Path('/tmp/heos-source/driver.json').write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate custom source
        if: steps.version.outputs.build_needed == 'true'
        env:
          CUSTOM_VERSION: ${{ steps.version.outputs.custom_version }}
        run: |
          set -euo pipefail
          python3 -m py_compile /tmp/heos-source/uc_intg_heos/remote.py
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path('/tmp/heos-source/driver.json').read_text())
          assert data['driver_id'] == 'heos-denon-ui'
          assert data['version'] == os.environ['CUSTOM_VERSION']
          assert data['custom'] is True
          assert data['name']['en'] == 'HEOS Remote 3 Custom'
          assert data['home_page'] == 'https://github.com/celle150190-prog/uc-intg-heos-custom'
          assert data['developer']['url'] == 'https://github.com/celle150190-prog/uc-intg-heos-custom'
          PY
          grep -q 'PWON' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'PWSTANDBY' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'MVUP' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'MVDOWN' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'CVSW UP' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'CVSW DOWN' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'NEXT_FAVORITE' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'PREVIOUS_FAVORITE' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'current_media_id' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'current_station' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'current_song' /tmp/heos-source/uc_intg_heos/remote.py
          grep -q 'play_preset_station' /tmp/heos-source/uc_intg_heos/remote.py

      - name: Verify only intended upstream files changed
        if: steps.version.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          test "$(git -C /tmp/heos-source status --porcelain | wc -l | tr -d ' ')" = "2"
          git -C /tmp/heos-source status --porcelain | grep -q '^ M uc_intg_heos/remote.py$'
          git -C /tmp/heos-source status --porcelain | grep -q '^ M driver.json$'

      - name: Build ARM64 PyInstaller distribution
        if: steps.version.outputs.build_needed == 'true'
        run: |
          set -euo pipefail
          docker run --rm --name builder \
            --platform=linux/arm64 \
            --user="$(id -u):$(id -g)" \
            -e PYINSTALLER_NAME="$PYINSTALLER_NAME" \
            -v /tmp/heos-source:/workspace \
            -w /workspace \
            "$PYINSTALLER_IMAGE" \
            bash -lc '
              set -euo pipefail
              test -n "${PYINSTALLER_NAME}"
              python -m pip install -r requirements.txt
              pyinstaller --clean --onedir --name "${PYINSTALLER_NAME}" \
                --collect-all zeroconf \
                --add-data driver.json:. \
                uc_intg_heos/__init__.py
              test -x "dist/${PYINSTALLER_NAME}/${PYINSTALLER_NAME}"
            '

      - name: Create Remote 3 archive
        if: steps.version.outputs.build_needed == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          artifact="uc-intg-heos-denon-ui-${UPSTREAM_VERSION}-aarch64.tar.gz"
          rm -rf /tmp/artifacts
          mkdir -p /tmp/artifacts/bin
          cp -a "/tmp/heos-source/dist/${PYINSTALLER_NAME}/." /tmp/artifacts/bin/
          test -x "/tmp/artifacts/bin/${PYINSTALLER_NAME}"
          mv "/tmp/artifacts/bin/${PYINSTALLER_NAME}" /tmp/artifacts/bin/driver
          cp /tmp/heos-source/driver.json /tmp/artifacts/driver.json
          test -f /tmp/artifacts/driver.json
          test -x /tmp/artifacts/bin/driver
          tar czf "$artifact" -C /tmp/artifacts .
          test -f "$artifact"
          tar -tzf "$artifact" > /tmp/archive-contents.txt
          grep -q '^./driver.json$' /tmp/archive-contents.txt
          grep -q '^./bin/driver$' /tmp/archive-contents.txt
          echo "ARTIFACT_NAME=$artifact" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          ls -lh "$artifact"

      - name: Upload Remote 3 archive
        if: steps.version.outputs.build_needed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: uc-intg-heos-denon-ui-${{ steps.version.outputs.upstream_version }}-aarch64
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: steps.version.outputs.build_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$ARTIFACT_NAME" \
            --title "HEOS Remote 3 Custom ${{ steps.version.outputs.custom_version }}" \
            --generate-notes
