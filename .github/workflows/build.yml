name: Build HEOS Custom 2.1.4

on:
  workflow_dispatch:

env:
  INTG_NAME: heos
  PYTHON_VER: 3.11.12-0.3.0

jobs:
  build:
    name: Build ARM64 Integration
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Download exact HEOS 2.1.2 source
        run: |
          git clone --depth 1 --branch v2.1.2 https://github.com/mase1981/uc-intg-heos.git upstream

      - name: Copy original HEOS source
        run: |
          cp -r upstream/uc_intg_heos .
          cp upstream/driver.json .
          cp upstream/requirements.txt .

      - name: Apply custom remote 2.1.4
        run: |
          python3 patch_remote_2.1.4_fixed.py
          python3 -m py_compile uc_intg_heos/remote.py

      - name: Set custom version
        run: |
          python3 - <<'PY'
          import json
          with open("driver.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          data["version"] = "2.1.4"
          data["description"]["en"] = "HEOS integration with favorites-only remote UI and Denon AVR power/subwoofer controls."
          with open("driver.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Enable ARM64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build ARM64
        run: |
          docker run --rm \
            --name heos-custom-builder \
            --platform=aarch64 \
            --user=$(id -u):$(id -g) \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
             python -m pip install -r requirements.txt && \
             pyinstaller --clean --onedir \
             --name intg-${INTG_NAME} \
             --collect-all zeroconf \
             --add-data driver.json:. \
             uc_intg_heos/__init__.py"

      - name: Create Remote 3 package
        run: |
          mkdir -p artifacts/bin
          cp -r dist/intg-${INTG_NAME}/* artifacts/bin/
          mv artifacts/bin/intg-${INTG_NAME} artifacts/bin/driver
          cp driver.json artifacts/
          tar czvf uc-intg-heos-2.1.4-custom-aarch64.tar.gz -C artifacts .

      - name: Upload finished integration
        uses: actions/upload-artifact@v4
        with:
          name: uc-intg-heos-2.1.4-custom-aarch64
          path: uc-intg-heos-2.1.4-custom-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 7
