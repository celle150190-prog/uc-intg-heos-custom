name: Validate HEOS 2.1.2 Remote patch

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone exact HEOS 2.1.2 source
        run: |
          rm -rf /tmp/heos-v212
          git clone --depth 1 --branch v2.1.2 https://github.com/mase1981/uc-intg-heos.git /tmp/heos-v212

      - name: Validate patch against v2.1.2
        run: |
          git -C /tmp/heos-v212 apply --check "$GITHUB_WORKSPACE/patches/remote_denon_ui.patch"
          git -C /tmp/heos-v212 apply "$GITHUB_WORKSPACE/patches/remote_denon_ui.patch"

      - name: Compile patched source
        run: python3 -m py_compile /tmp/heos-v212/uc_intg_heos/remote.py

      - name: Check required mappings
        run: |
          grep -q 'PWSTANDBY' /tmp/heos-v212/uc_intg_heos/remote.py
          grep -q 'PWON' /tmp/heos-v212/uc_intg_heos/remote.py
          grep -q 'MVUP' /tmp/heos-v212/uc_intg_heos/remote.py
          grep -q 'MVDOWN' /tmp/heos-v212/uc_intg_heos/remote.py
          grep -q 'CVSW UP' /tmp/heos-v212/uc_intg_heos/remote.py
          grep -q 'CVSW DOWN' /tmp/heos-v212/uc_intg_heos/remote.py
          grep -q 'PREVIOUS_FAVORITE' /tmp/heos-v212/uc_intg_heos/remote.py
          grep -q 'NEXT_FAVORITE' /tmp/heos-v212/uc_intg_heos/remote.py
          grep -q 'play_preset_station' /tmp/heos-v212/uc_intg_heos/remote.py

      - name: Check custom driver metadata
        run: |
          grep -q '"driver_id": "uc-intg-heos-denon-ui"' driver.json
          grep -q '"version": "2.1.2-custom.1"' driver.json
