name: Validate HEOS 2.1.2 Remote patch

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile project source
        run: python3 -m py_compile uc_intg_heos/remote.py
      - name: Validate patch against v2.1.2 reference
        shell: bash
        run: |
          rm -rf /tmp/heos-v212
          mkdir -p /tmp/heos-v212/uc_intg_heos
          cp docs/remote_v2.1.2_reference.py /tmp/heos-v212/uc_intg_heos/remote.py
          cp patches/remote_denon_ui.patch /tmp/remote_denon_ui.patch
          cd /tmp/heos-v212
          git init -q
          git add uc_intg_heos/remote.py
          git apply --check /tmp/remote_denon_ui.patch
      - name: Check required mappings
        run: |
          grep -q 'PWSTANDBY' uc_intg_heos/remote.py
          grep -q 'PWON' uc_intg_heos/remote.py
          grep -q 'MVUP' uc_intg_heos/remote.py
          grep -q 'MVDOWN' uc_intg_heos/remote.py
          grep -q 'CVSW UP' uc_intg_heos/remote.py
          grep -q 'CVSW DOWN' uc_intg_heos/remote.py
          grep -q 'play_preset_station' uc_intg_heos/remote.py
